<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game-Hub – Online Chess</title>
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
h1 { margin-bottom: 8px; color: #e94560; }
.subtitle { color: #a0a0b0; margin-bottom: 16px; font-size: 0.95rem; }
.nav { margin-bottom: 20px; }
.nav a { color: #e94560; text-decoration: none; margin: 0 12px; }
.nav a:hover { text-decoration: underline; }
#lobby, #game { width: 100%; max-width: 600px; }
.card { background: #16213e; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
input, button { padding: 10px 16px; border: none; border-radius: 8px; font-size: 16px; }
input { width: 100%; margin-bottom: 12px; background: #0f3460; color: #fff; }
button { background: #e94560; color: #fff; cursor: pointer; margin: 4px; }
button:hover { background: #ff6b81; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
#board { width: 100%; max-width: 500px; margin: 0 auto 16px; }
.status { text-align: center; margin: 12px 0; font-size: 18px; }
.hidden { display: none; }
.room-code { font-size: 28px; letter-spacing: 4px; text-align: center; color: #e94560; margin: 12px 0; }
</style>
</head>
<body>
<nav class="nav">
  <a href="/">Play Chess</a>
  <a href="/about.html">About</a>
</nav>
<h1>Game-Hub</h1>
<p class="subtitle">Online Chess – Play with friends</p>

<div id="lobby">
  <div class="card">
    <h2>Create Game</h2>
    <button id="createBtn">Create Room</button>
    <div id="createdRoom" class="hidden">
      <p>Share this code with your friend:</p>
      <div class="room-code" id="roomCodeDisplay"></div>
      <p>Waiting for opponent...</p>
    </div>
  </div>
  <div class="card">
    <h2>Join Game</h2>
    <input id="joinCode" placeholder="Enter room code" maxlength="6">
    <button id="joinBtn">Join Room</button>
  </div>
</div>

<div id="game" class="hidden">
  <div class="status" id="status">White to move</div>
  <div id="board"></div>
  <div style="text-align:center">
    <button id="resignBtn">Resign</button>
    <button id="newGameBtn">New Game</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const game = new Chess();
let board = null;
let myColor = null;
let roomId = null;
let isMyTurn = false;

const lobby = document.getElementById('lobby');
const gameDiv = document.getElementById('game');
const statusEl = document.getElementById('status');
const roomCodeDisplay = document.getElementById('roomCodeDisplay');
const createdRoom = document.getElementById('createdRoom');

document.getElementById('createBtn').onclick = () => {
  socket.emit('createRoom');
};

document.getElementById('joinBtn').onclick = () => {
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  if (code.length === 6) socket.emit('joinRoom', code);
};

document.getElementById('resignBtn').onclick = () => {
  if (confirm('Resign?')) socket.emit('resign', roomId);
};

document.getElementById('newGameBtn').onclick = () => {
  location.reload();
};

socket.on('roomCreated', (code) => {
  roomId = code;
  roomCodeDisplay.textContent = code;
  createdRoom.classList.remove('hidden');
  document.getElementById('createBtn').disabled = true;
});

socket.on('startGame', (data) => {
  roomId = data.roomId;
  myColor = data.color;
  isMyTurn = myColor === 'w';
  lobby.classList.add('hidden');
  gameDiv.classList.remove('hidden');
  initBoard();
  updateStatus();
});

socket.on('move', (move) => {
  game.move(move);
  board.position(game.fen());
  isMyTurn = true;
  updateStatus();
});

socket.on('gameOver', (msg) => {
  statusEl.textContent = msg;
  isMyTurn = false;
});

socket.on('error', (msg) => alert(msg));

function initBoard() {
  const config = {
    draggable: true,
    position: 'start',
    orientation: myColor === 'b' ? 'black' : 'white',
    onDragStart: (source, piece) => {
      if (!isMyTurn || game.game_over()) return false;
      if ((myColor === 'w' && piece.search(/^b/) !== -1) ||
          (myColor === 'b' && piece.search(/^w/) !== -1)) return false;
    },
    onDrop: (source, target) => {
      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';
      socket.emit('move', { roomId, move });
      isMyTurn = false;
      updateStatus();
    },
    onSnapEnd: () => board.position(game.fen())
  };
  board = Chessboard('board', config);
  window.addEventListener('resize', () => board.resize());
}

function updateStatus() {
  if (game.in_checkmate()) {
    statusEl.textContent = 'Checkmate! ' + (game.turn() === 'w' ? 'Black' : 'White') + ' wins';
  } else if (game.in_draw()) {
    statusEl.textContent = 'Draw';
  } else {
    const turn = game.turn() === 'w' ? 'White' : 'Black';
    statusEl.textContent = turn + ' to move' + (game.in_check() ? ' (Check)' : '') +
      (isMyTurn ? ' — Your turn' : ' — Opponent\'s turn');
  }
}
</script>
</body>
</html>
